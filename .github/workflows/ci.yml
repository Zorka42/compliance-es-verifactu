name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux JVM and Android
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test common, JVM, and Android code
        run: ./gradlew check compileKotlinMetadata jvmTest testAndroidHostTest apiCheck dokkaHtml koverXmlReportJvm koverVerifyJvm
      - name: Build local JVM publications
        run: ./gradlew publishJvmPreview
      - name: Build the independent consumer distribution
        run: ./gradlew --no-daemon -p samples/maven-consumer installDist
      - name: Select Java 11 for the independent consumer
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify published artifacts on a Java 11 runtime
        run: |
          java -version
          samples/maven-consumer/build/install/verifactu-java-consumer/bin/verifactu-java-consumer
      - name: Upload JVM coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: verifactu-core/build/reports/kover/reportJvm.xml,verifactu-xml/build/reports/kover/reportJvm.xml,verifactu-qr/build/reports/kover/reportJvm.xml,verifactu-aeat/build/reports/kover/reportJvm.xml
          fail_ci_if_error: true

  apple:
    name: Apple targets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test Apple targets
        run: ./gradlew compileKotlinMetadata compileKotlinIosArm64 iosSimulatorArm64Test macosArm64Test
